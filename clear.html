<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除 MP3 播放器專屬快取</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      color: #1e293b;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status {
      font-weight: bold;
      color: #4f46e5;
    }
    .success {
      color: #059669;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">正在為您清理快取</h1>
    <p id="desc">正在精準清理 MP3 播放器的 Service Worker 與專屬快取，請稍候...</p>
    <div id="status" class="status">清理中...</div>
  </div>

  <script>
    async function clearApp() {
      let swCleared = 0;
      let cacheCleared = 0;

      // 1. 登出該網域下本播放器的 Service Worker
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          // 確保只登出本播放器路徑的 Service Worker，安全防護不越界
          if (registration.scope.includes('/mp3-player/')) {
            await registration.unregister();
            swCleared++;
          }
        }
      }

      // 2. 精準刪除帶有 'mp3player' 前綴的快取
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let key of keys) {
          if (key.includes('mp3player')) {
            await caches.delete(key);
            cacheCleared++;
          }
        }
      }

      // 更新 UI 顯示成功
      document.getElementById('title').innerText = '🎉 快取清理成功！';
      document.getElementById('desc').innerText = `已成功登出 ${swCleared} 個相關服務，並刪除 ${cacheCleared} 組專屬快取。這不會影響您在同網域下的其他 GitHub 專案。`;
      const statusEl = document.getElementById('status');
      statusEl.className = 'status success';
      statusEl.innerText = '請關閉此分頁，重新打開播放器主頁即可看到最新版！';
    }

    clearApp().catch(err => {
      document.getElementById('title').innerText = '❌ 清理失敗';
      document.getElementById('desc').innerText = '在清理過程中遇到錯誤：' + err.message;
      const statusEl = document.getElementById('status');
      statusEl.className = 'status error';
      statusEl.innerText = '請嘗試重新整理此頁面。';
    });
  </script>
</body>
</html>
